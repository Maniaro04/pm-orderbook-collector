# Records Kalshi and Polymarket order books once a minute on GitHub's servers.
# One run lasts about 5 h 25 min (a job may not run longer than 6 hours), then starts the next one.
# Data goes to this repository's Releases: one release per UTC day ("data-YYYY-MM-DD"),
# plus the release "state" (list of tracked markets, market descriptions, status, index of all files).
# To stop collecting: Actions tab -> "collect" and "watchdog" -> "..." -> Disable workflow.
name: collect

on:
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_TAG: r${{ github.run_number }}
      MAX_CYCLES: "320"
    steps:
      - uses: actions/checkout@v4

      - name: Restore the tracked markets from the last run
        run: |
          mkdir -p data/books
          gh release view state >/dev/null 2>&1 || gh release create state --latest=false \
            --title "Collector state" --notes "Tracked markets, market descriptions, last status and an index of all data files. Rewritten by every run."
          gh release download state -D data/books --clobber \
            -p tracked_K.json -p tracked_P.json -p meta_K.jsonl.gz -p meta_P.jsonl.gz || echo "no saved state yet"
          ls -la data/books

      - name: Collect
        run: |
          mkdir -p /tmp/up
          upload() {
            for f in data/books/books_*.jsonl.gz data/books/cycles_*.jsonl; do
              [ -f "$f" ] || continue
              b=$(basename "$f")
              day=$(echo "$b" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
              tag="data-$day"
              out="/tmp/up/${b%%.*}_${RUN_TAG}.${b#*.}"
              cp "$f" "$out"
              gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --latest=false \
                --title "Order books $day (UTC)" --notes "One-minute order-book snapshots of Kalshi and Polymarket markets. Public market data, collected for a university research project."
              gh release upload "$tag" "$out" --clobber
              rm -f "$out"
            done
            for f in tracked_K.json tracked_P.json meta_K.jsonl.gz meta_P.jsonl.gz status.json; do
              [ -f "data/books/$f" ] && cp "data/books/$f" "/tmp/up/$f" && gh release upload state "/tmp/up/$f" --clobber
            done
            if [ -f data/books/collector.log ]; then
              tail -n 400 data/books/collector.log > /tmp/up/collector_last.log
              gh release upload state /tmp/up/collector_last.log --clobber
            fi
            gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
              --jq '.[] | .tag_name as $t | .assets[] | [$t, .name, (.size|tostring), .updated_at] | @tsv' > /tmp/up/index.tsv
            gh release upload state /tmp/up/index.tsv --clobber
          }
          python3 collect_books.py run --out data/books --max-cycles "$MAX_CYCLES" &
          PID=$!
          n=0
          while kill -0 "$PID" 2>/dev/null; do
            sleep 60
            n=$((n+1))
            if [ "$n" -eq 4 ] || [ $((n % 20)) -eq 0 ]; then upload || echo "upload failed, will retry"; fi
          done
          wait "$PID" || echo "the collector ended with an error"
          upload || echo "final upload failed"
          cat data/books/status.json || true

      - name: Start the next run
        run: |
          cycles=$(python3 -c "import json;print(json.load(open('data/books/status.json')).get('cycles',0))" 2>/dev/null || echo 0)
          if [ "$cycles" -ge 30 ]; then
            gh workflow run collect.yml --ref "$GITHUB_REF_NAME"
          else
            echo "only $cycles snapshots: not restarting at once; the watchdog will try again"
          fi
